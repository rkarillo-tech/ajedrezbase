# Ejecuta todas las pruebas en cada cambio y, si pasan en main, publica la web en GitHub Pages.
# index.html, sw.js y sf-worker.js no se guardan en el repositorio: se generan aquí con build.py.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Pruebas y publicación
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: La aplicación se construye y GUIA.md está al día con src/help.html
        run: python3 build.py --check
      - name: Construir
        run: python3 build.py
      - name: Núcleo (reglas, motor interno, PGN)
        run: node tests/test_reglas.js
      - name: Lógica de la aplicación (repasos, estadísticas, filtros, informe, sincronización)
        run: node tests/test_logica.js
      - name: Instalar Playwright
        # Con reintentos: a veces los servidores de paquetes de Ubuntu no responden desde GitHub
        run: |
          python3 -m pip install --quiet playwright
          for i in 1 2 3; do python3 -m playwright install --with-deps chromium && break; [ $i = 3 ] && exit 1; echo "Reintento $i…"; sleep 30; done
      - name: Descargar Stockfish 19 (para probarlo sin depender del CDN)
        run: |
          npm pack stockfish@19.0.1 --silent
          mkdir -p /tmp/sf && tar xzf stockfish-19.0.1.tgz -C /tmp/sf package/bin/stockfish-19-lite-single.js package/bin/stockfish-19-lite-single.wasm
      - name: Aplicación en el navegador
        env:
          STOCKFISH_DIR: /tmp/sf/package/bin
        run: python3 tests/test_app.py
      - name: Montar la web
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 build.py --site _site
      - name: Preparar la web para GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
